name: Release Hum
run-name: ${{ inputs.version && format('Release Hum {0}', inputs.version) || format('Release Hum from {0}', inputs.ref) }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version being released, such as 2026.2.1.0 (shown as the run's title and checked against the source)
        default: ''
      publish:
        description: Publish the release when every build succeeds (turn off to leave a draft)
        type: boolean
        default: true
      ref:
        description: Branch or tag of the Hum source to build
        default: main

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      shown: ${{ steps.version.outputs.shown }}
    steps:
      - name: Read the version
        id: version
        env:
          GH_TOKEN: ${{ secrets.HUM_SOURCE_TOKEN }}
          REF: ${{ inputs.ref }}
          EXPECTED: ${{ inputs.version }}
        run: |
          stored="$(gh api "repos/TylerCodesTech/Hum/contents/hum-desktop/package.json?ref=${REF}" -H 'Accept: application/vnd.github.raw' | jq -r .version)"
          if ! [[ "$stored" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not read the version from the Hum source"
            exit 1
          fi
          IFS=. read -r year major packed <<< "$stored"
          shown="${year}.${major}.$((packed / 1000)).$((packed % 1000))"
          if [ -n "$EXPECTED" ] && [ "$EXPECTED" != "$shown" ]; then
            echo "::error::You asked to release $EXPECTED but the Hum source is at $shown"
            exit 1
          fi
          echo "Releasing Hum $shown (stored as $stored)"
          echo "shown=${shown}" >> "$GITHUB_OUTPUT"
          echo "tag=hum-v${shown}" >> "$GITHUB_OUTPUT"
  release:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: ''
          - os: macos-latest
            name: macos-universal
            args: --target universal-apple-darwin
          - os: ubuntu-22.04
            name: linux
            args: --bundles deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check secrets
        shell: bash
        env:
          SOURCE: ${{ secrets.HUM_SOURCE_TOKEN }}
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUB: ${{ secrets.HUM_UPDATER_PUBKEY }}
        run: |
          if [ -z "$SOURCE" ] || [ -z "$KEY" ] || [ -z "$PUB" ]; then
            echo "::error::Add the HUM_SOURCE_TOKEN, TAURI_SIGNING_PRIVATE_KEY and HUM_UPDATER_PUBKEY secrets to this repository first"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: TylerCodesTech/Hum
          ref: ${{ inputs.ref }}
          token: ${{ secrets.HUM_SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos-universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install packages
        working-directory: hum-desktop
        run: npm ci
      - name: Write the release config
        working-directory: hum-desktop
        shell: bash
        env:
          HUM_UPDATER_PUBKEY: ${{ secrets.HUM_UPDATER_PUBKEY }}
        run: |
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.release.conf.json', 'utf8'));
            const pubkey = process.env.HUM_UPDATER_PUBKEY.replace(/\s+/g, '');
            conf.plugins = { ...conf.plugins, updater: { ...conf.plugins?.updater, pubkey } };
            fs.writeFileSync('src-tauri/tauri.ci.conf.json', JSON.stringify(conf, null, 2));
          "
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          HUM_UPDATER_PUBKEY: ${{ secrets.HUM_UPDATER_PUBKEY }}
        with:
          projectPath: hum-desktop
          owner: TylerCodesTech
          repo: Hum-releases
          releaseCommitish: main
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: Hum ${{ needs.prepare.outputs.shown }}
          assetNamePattern: Hum_${{ needs.prepare.outputs.shown }}_[platform]_[arch][setup][ext]
          releaseBody: Download the installer for your computer below. Copies of Hum that are already installed update themselves.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }} --config src-tauri/tauri.ci.conf.json
  publish:
    needs: [prepare, release]
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      publish: ${{ inputs.publish }}
