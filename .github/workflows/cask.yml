name: Update Homebrew cask
run-name: Update Homebrew cask for ${{ inputs.tag || github.event.release.tag_name }}

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to point the cask at, such as hum-v2026.1.1
        required: true

permissions:
  contents: write

jobs:
  cask:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Write the cask
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          version="${TAG#hum-v}"
          curl -fL --retry 3 -o "$RUNNER_TEMP/hum.dmg" "https://github.com/TylerCodesTech/Hum-releases/releases/download/${TAG}/Hum_${version}_universal.dmg"
          sha="$(sha256sum "$RUNNER_TEMP/hum.dmg" | cut -d' ' -f1)"
          scripts/write-cask.sh "$version" "$sha"
      - name: Commit the cask
        run: |
          git config user.name "Tyler McCall"
          git config user.email "132624407+TylerCodesTech@users.noreply.github.com"
          git add Casks/hum.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date"
          else
            git commit -m "Point the Homebrew cask at ${TAG}"
            git push
          fi
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
