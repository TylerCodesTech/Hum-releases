name: Watch for a new Hum version
run-name: Watch for a new Hum version

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Start a release when the source has a version that was never released
        env:
          SOURCE_TOKEN: ${{ secrets.HUM_SOURCE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          stored="$(GH_TOKEN="$SOURCE_TOKEN" gh api 'repos/TylerCodesTech/Hum/contents/hum-desktop/package.json?ref=main' -H 'Accept: application/vnd.github.raw' | jq -r .version)"
          if ! [[ "$stored" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not read the version from the Hum source"
            exit 1
          fi
          IFS=. read -r year major packed <<< "$stored"
          shown="${year}.${major}.$((packed / 1000)).$((packed % 1000))"
          echo "Hum main is at $shown"
          if gh release view "hum-v${shown}" > /dev/null 2>&1; then
            echo "Hum $shown already has a release. Nothing to do."
            exit 0
          fi
          runs="$(gh run list --workflow release.yml --limit 100 --json displayTitle,status,conclusion,createdAt --jq "[.[] | select(.displayTitle == \"Release Hum ${shown}\")]")"
          if [ "$(jq '[.[] | select(.status != "completed")] | length' <<< "$runs")" -ne 0 ]; then
            echo "A build for Hum $shown is running."
            exit 0
          fi
          if [ "$(jq '[.[] | select(.conclusion == "success")] | length' <<< "$runs")" -ne 0 ]; then
            echo "A build for Hum $shown already finished."
            exit 0
          fi
          last="$(jq -r '[.[].createdAt] | max // ""' <<< "$runs")"
          if [ -n "$last" ]; then
            changed="$(GH_TOKEN="$SOURCE_TOKEN" gh api 'repos/TylerCodesTech/Hum/commits/main' --jq .commit.committer.date)"
            if [[ ! "$changed" > "$last" ]]; then
              echo "The last build for Hum $shown failed and the source has not changed since. Fix the cause in the Hum source, or start Release Hum again by hand."
              exit 0
            fi
            echo "The last build for Hum $shown failed, and the source changed after it. Trying again."
          fi
          echo "Starting the release build for Hum $shown"
          gh workflow run release.yml --ref main -f ref=main -f "version=${shown}" -f publish=true
